name: Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install install-electron
      - run: npx playwright install --with-deps chromium
      - name: Install desktop test tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb openbox dbus-x11 gnome-keyring desktop-file-utils apparmor-utils x11-utils
      - run: npm test
      - run: npm run package:linux
      - name: Install the Debian package and allow the development Electron sandbox
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y ./release/pipeline-desk_*_amd64.deb
          cat > "$RUNNER_TEMP/pipeline-desk-tests" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile pipeline-desk-tests "$GITHUB_WORKSPACE/node_modules/electron/dist/electron" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/pipeline-desk-tests"
      - name: Test native windows, keyring, migration and installed package
        run: sh scripts/test-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-desk-ubuntu-amd64
          path: release/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ubuntu-screenshots
          path: .impeccable/review/*.png
          include-hidden-files: true
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install install-electron
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package
      - run: node tests/package-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-desk-windows-x64
          path: release/PipelineDesk-win32-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-screenshots
          path: .impeccable/review/*.png
          include-hidden-files: true
          if-no-files-found: ignore
